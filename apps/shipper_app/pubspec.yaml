name: shipper_app
description: Tran Gia Food — Shipper Delivery App
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared packages (workspace)
  shared_models:
  shared_ui:
  api_client:

  # Navigation & State
  go_router: ^17.4.0
  iconsax: ^0.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Maps & Location (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3
  location: ^10.0.2

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0

  # Realtime (order assignment, location push)
  socket_io_client: ^3.1.6

  # Audio (new order alert)
  audioplayers: ^6.0.0

  # Chat & Call (Stringee)
  # stringee_flutter_plugin: ^x.x.x  ← thêm khi tích hợp

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Camera (for delivery proof photo)
  image_picker: ^1.1.1
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
