name: customer_app
description: Tran Gia Food — Customer App for ordering food
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared packages (workspace)
  shared_models:
  shared_ui:
  api_client:

  # Navigation
  go_router: ^17.4.0
  iconsax: ^0.0.8
  cached_network_image: ^3.3.1

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Maps (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6

  # Auth
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.0.1
  sign_in_with_apple: ^8.1.0

  # Realtime
  socket_io_client: ^3.1.6

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^10.3.1

  # Payments
  # momo_payment: ^x.x.x  ← thêm khi tích hợp

  # Utils
  http: ^1.2.1
  permission_handler: ^13.0.0
  image_picker: ^1.1.1
  geolocator: ^14.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
