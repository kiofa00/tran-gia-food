name: restaurant_app
description: Tran Gia Food — Restaurant Management App
version: 1.0.0+1
publish_to: none

resolution: workspace

environment:
  sdk: '^3.12.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Shared packages (workspace)
  shared_models:
  shared_ui:
  api_client:

  # Navigation & State
  go_router: ^17.4.0
  iconsax: ^0.0.8
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6

  # Realtime (new order notifications)
  socket_io_client: ^3.1.6

  # Audio (new order sound alert)
  audioplayers: ^6.0.0

  # Charts (revenue dashboard)
  fl_chart: ^1.2.0

  # Storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utils
  image_picker: ^1.1.1
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
