services:
  postgres:
    image: postgres:15-alpine
    container_name: tran_gia_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tran_gia_food
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tran_gia_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
