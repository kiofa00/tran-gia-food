name: shared_ui
description: Shared UI components, design system, and theme for Tran Gia Food apps
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_models:
    path: ../shared_models

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Theme
  flex_color_scheme: ^7.3.1

  # i18n
  easy_localization: ^3.0.7
  intl: ^0.19.0

  # Icons
  iconsax: ^0.0.8

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Images
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  assets:
    - assets/translations/
    - assets/animations/
    - assets/images/
