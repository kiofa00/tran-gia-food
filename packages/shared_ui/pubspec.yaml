name: shared_ui
description: Shared UI components, design system, and theme for Tran Gia Food apps
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: '^3.12.2'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_models:

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Theme
  flex_color_scheme: ^8.4.0

  # i18n
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Icons
  iconsax: ^0.0.8

  # Fonts
  google_fonts: ^8.2.1

  # Animations
  lottie: ^3.1.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Images
  cached_network_image: ^3.3.1

  # Storage
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.8
  riverpod_generator: ^4.0.4

flutter:
  assets:
    - assets/translations/
    - assets/animations/
    - assets/images/
