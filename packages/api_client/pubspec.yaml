name: api_client
description: Shared HTTP client and API services for Tran Gia Food apps
version: 0.0.1
publish_to: none

resolution: workspace

environment:
  sdk: '^3.12.2'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  shared_models:

  # HTTP
  dio: ^5.4.3+1
  http: ^1.2.0
  pretty_dio_logger: ^1.3.1

  # Storage (for auth tokens)
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.2.0

  # WebSocket / realtime
  socket_io_client: ^3.1.6

  # Riverpod
  flutter_riverpod: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
