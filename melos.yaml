name: tran_gia_app

packages:
  - apps/customer_app
  - apps/restaurant_app
  - apps/shipper_app
  - packages/shared_models
  - packages/shared_ui
  - packages/api_client

scripts:
  lint:
    run: flutter analyze lib
    description: Lint (analyze) all Flutter packages
    exec:
      concurrency: 1

  analyze:
    run: flutter analyze
    description: Analyze all Flutter packages
    exec:
      concurrency: 1

  test:
    run: flutter test
    description: Run tests for all packages

  format:
    run: dart format .
    description: Format all Dart code
